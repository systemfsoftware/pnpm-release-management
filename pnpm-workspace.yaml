allowBuilds:
  cpu-features: false
  msgpackr-extract: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  ssh2: false
# Three days (minutes); the same in every systemfsoftware repo, so producer and consumer gates agree.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - effect
  - "@effect/*"
packages:
  - packages/*
  - apps/*
  - e2e
supportedArchitectures:
  os: [linux]
  cpu: [x64, arm64]
  libc: [glibc]
