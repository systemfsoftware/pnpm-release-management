version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    labels:
      - "automerge"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"

        update-types:
          - minor
          - patch
  - package-ecosystem: "nix"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
