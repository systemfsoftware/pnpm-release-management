name: Changeset Check

on:
  workflow_call:
    inputs:
      base-sha:
        description: commit the pull request is compared against
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  require-intent:
    name: a publishable-package change needs an intent
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Allow unprivileged user namespaces for the sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install through the sandbox, offline from the Nix pnpm store
        run: nix develop --command sandbox -- pnpm install

      - name: Install the caller's workspace
        run: pnpm install --frozen-lockfile

      - name: Require an intent for every publishable-package change
        env:
          BASE_SHA: ${{ inputs.base-sha || github.event.pull_request.base.sha }}
        run: nix develop --command sandbox -- changeset-management check "$BASE_SHA"
