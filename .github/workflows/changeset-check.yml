name: Changeset Check

on:
  workflow_call:
    inputs:
      tools-ref:
        description: ignored; the check runs the release tools at this workflow's own revision
        required: false
        type: string
        default: ""
      base-sha:
        description: commit the pull request is compared against
        required: false
        type: string
        default: ""
      node-version:
        description: node version used for pnpm
        required: false
        type: string
        default: "24"
      devshell:
        description: ignored; the check installs nothing and enters no dev shell
        required: false
        type: boolean
        default: false
      runs-on:
        description: JSON-encoded runner selector for every job (default keeps hosted ubuntu-latest)
        required: false
        type: string
        default: '"ubuntu-latest"'

permissions: {}

jobs:
  require-intent:
    name: a publishable-package change needs an intent
    if: github.head_ref != 'changeset-release/main'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        if: runner.environment == 'github-hosted'
      - uses: actions/setup-node@v7
        if: runner.environment == 'github-hosted'
        with:
          node-version: ${{ inputs.node-version }}

      # Self-hosted (bare-NixOS fleet) runners get node + pnpm from the image's
      # toolchain instead: actions/setup-node downloads a glibc binary that will
      # not run there. pnpm/setup replaces action-setup + setup-node for pnpm v11+.
      - uses: pnpm/setup@v3
        if: runner.environment != 'github-hosted'
        with:
          runtime: node@${{ inputs.node-version }}

      - uses: cachix/install-nix-action@v31
        if: runner.environment == 'github-hosted'

      - name: Build the release tools at this workflow's own revision
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          tools=$(nix build --no-link --print-out-paths \
            "github:${WORKFLOW_REPOSITORY:?job.workflow_repository is empty}/${WORKFLOW_SHA:?job.workflow_sha is empty}#release-tools")
          echo "RELEASE_TOOLS=$tools/bin" >> "$GITHUB_ENV"

      - name: Require an intent for every publishable-package change
        env:
          BASE_SHA: ${{ inputs.base-sha || github.event.pull_request.base.sha }}
        run: |
          "$RELEASE_TOOLS/changeset-management" check "$BASE_SHA"

      - name: List released packages that change without a release
        id: digests
        env:
          BASE_SHA: ${{ inputs.base-sha || github.event.pull_request.base.sha }}
        run: |
          "$RELEASE_TOOLS/github-release-management" digests "$BASE_SHA" --output "$GITHUB_OUTPUT"

      - name: Compare their flake-built tarballs with their release tags
        if: steps.digests.outputs.packages != ''
        env:
          BASE_SHA: ${{ inputs.base-sha || github.event.pull_request.base.sha }}
          PACKAGES: ${{ steps.digests.outputs.packages }}
        run: |
          if ! tarballs=$(nix build --no-link --print-out-paths .#workspace-tarballs); then
            echo "::error::tag digests: cannot build .#workspace-tarballs to compare ${PACKAGES} with their release tags - the caller's flake must expose workspace-tarballs, as release.yml requires"
            exit 1
          fi
          "$RELEASE_TOOLS/github-release-management" digests "$BASE_SHA" --tarballs "$tarballs"

      - name: Record the job's wall time
        if: always()
        env:
          START: ${{ steps.start.outputs.at }}
        run: |
          echo "changeset check wall time: $(( $(date +%s) - START ))s" >> "$GITHUB_STEP_SUMMARY"
