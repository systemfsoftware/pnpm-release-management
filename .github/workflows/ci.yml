name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: format · lint · check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Install the npm graph
        run: deno install --frozen-lockfile

      - uses: cachix/install-nix-action@v31

      - name: dprint from the flake
        run: echo "$(nix build --no-link --print-out-paths .#dprint)/bin" >> "$GITHUB_PATH"

      - name: Format
        run: deno task format:check

      - name: Lint
        run: deno task lint

      - name: Check
        run: deno task check

      - name: Type-aware lint (schema, workflow and cell cores)
        run: deno task lint:core

      - name: Effect diagnostics
        run: deno task lint:tsgo
