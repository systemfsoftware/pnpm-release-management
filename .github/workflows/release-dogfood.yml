# Dogfood: this repository runs its OWN reusable release workflow
# (.github/workflows/release.yml) against itself, exactly as a consumer repo
# would. The reusable is the single definition of the release flow; this caller
# only supplies the trigger and the permissions, per the documented contract.
name: Release (dogfood)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      ci-workflow: ci.yml
