# The release phase is never triggered by the release PR merging: closing it
# destroys refs/pull/<n>/merge and cancels the queued run with zero jobs, so a
# release triggered that way can vanish silently. Phase comes from repository
# state instead, which also lets a half-finished release resume on the next push.
name: Release

on:
  workflow_call:
    inputs:
      artifacts-dir:
        description: directory the captured cycle is written to
        required: false
        type: string
        default: .release
      ci-workflow:
        description: the caller's CI workflow file, dispatched on the release PR branch
        required: true
        type: string
      runs-on:
        description: JSON-encoded runner selector for every job (default keeps hosted ubuntu-latest)
        required: false
        type: string
        default: '"ubuntu-latest"'

permissions: {}

jobs:
  plan:
    name: plan · derive phase
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
    outputs:
      phase: ${{ steps.plan.outputs.phase }}
      pending_intents: ${{ steps.plan.outputs.pending_intents }}
      this_cycle: ${{ steps.plan.outputs.this_cycle }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: cachix/install-nix-action@v31
        if: runner.environment == 'github-hosted'

      - &release-tools
        name: Build the release tools at this workflow's own revision
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          tools=$(nix build --no-link --print-out-paths \
            "github:${WORKFLOW_REPOSITORY:?job.workflow_repository is empty}/${WORKFLOW_SHA:?job.workflow_sha is empty}#release-tools")
          echo "RELEASE_TOOLS=$tools/bin" >> "$GITHUB_ENV"

      - &workspace-tarballs
        name: Pack the workspace through the caller's flake
        run: echo "TARBALLS=$(nix build --no-link --print-out-paths .#workspace-tarballs)" >> "$GITHUB_ENV"

      - id: plan
        name: Decide release phase from repository state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix develop --command "$RELEASE_TOOLS/github-release-management" plan --tarballs "$TARBALLS" --output "$GITHUB_OUTPUT"

  version:
    name: version · open release PR
    needs: plan
    if: needs.plan.outputs.phase == 'version'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: cachix/install-nix-action@v31
        if: runner.environment == 'github-hosted'

      - *release-tools

      - name: Bump every package and version surface, consuming the intents
        run: nix develop --command "$RELEASE_TOOLS/version-management" bump

      - id: pr
        name: Open or update the release PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix develop --command "$RELEASE_TOOLS/github-release-management" pr --output "$GITHUB_OUTPUT"

      - name: Run the caller's CI on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          PR_OUTCOME: ${{ steps.pr.outputs.outcome }}
          PR_BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          case "$PR_OUTCOME" in
            created | updated) gh workflow run "$CI_WORKFLOW" --ref "${PR_BRANCH:?pr reported no branch}" ;;
            closed | vacant) echo "no open release PR ($PR_OUTCOME); nothing to dispatch" ;;
            *) echo "::error::pr reported no outcome; cannot tell whether a release PR needs CI"; exit 1 ;;
          esac

  release:
    name: release · tag · GitHub releases
    needs: plan
    if: needs.plan.outputs.phase == 'release'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
      - uses: cachix/install-nix-action@v31
        if: runner.environment == 'github-hosted'

      - *release-tools

      - *workspace-tarballs

      - name: Capture this cycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${{ inputs.artifacts-dir }}"
          nix develop --command "$RELEASE_TOOLS/github-release-management" tag --tarballs "$TARBALLS" \
            --output "${{ inputs.artifacts-dir }}/captured.json"

      - name: Tag released versions, recording each tarball's integrity
        run: |
          nix develop --command "$RELEASE_TOOLS/github-release-management" tag --tarballs "$TARBALLS" \
            --captured "${{ inputs.artifacts-dir }}/captured.json"

      - name: GitHub Releases from the authored changelogs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          nix develop --command "$RELEASE_TOOLS/github-release-management" release \
            --captured "${{ inputs.artifacts-dir }}/captured.json"
