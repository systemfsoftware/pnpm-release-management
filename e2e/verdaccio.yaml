url_prefix: https://registry.npmjs.org/
storage: /tmp/verdaccio/storage
auth:
  htpasswd:
    file: /tmp/verdaccio/htpasswd
packages:
  "@*/*":
    access: $all
    publish: $all
    unpublish: $all
  "**":
    access: $all
    publish: $all
    unpublish: $all
security:
  api:
    jwt:
      sign:
        expiresIn: 1d
        notBefore: 1
      verify:
        notBefore: 1
  web:
    sign:
      expiresIn: 1d
log:
  type: stdout
  format: pretty
  level: warn
