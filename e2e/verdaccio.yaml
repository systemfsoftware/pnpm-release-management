url_prefix: https://registry.npmjs.org/
storage: /tmp/verdaccio/storage
auth:
  htpasswd:
    file: /tmp/verdaccio/htpasswd
packages:
  "@*/*":
    access: $all
    publish: $all
  "**":
    access: $all
    publish: $all
log:
  type: file
  format: pretty
  level: http
  path: /tmp/verdaccio/verdaccio.log
