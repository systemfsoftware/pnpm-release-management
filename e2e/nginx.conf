daemon off;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
  worker_connections 64;
}

http {
  access_log off;

  server {
    listen 443 ssl;
    server_name api.github.com;
    ssl_certificate /e2e/server.crt;
    ssl_certificate_key /e2e/server.key;
    location / {
      proxy_pass http://127.0.0.1:4000;
      proxy_redirect off;
      proxy_http_version 1.1;
    }
  }
}
